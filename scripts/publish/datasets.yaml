# Datasets supported for submission to the leaderboard.
#
# Each entry defines:
#   experiment_key_pattern  Glob pattern matching experiment keys for this dataset.
#   required_files          Files that must be present in the run dir for a valid submission.
#   description             Short description of the dataset.
#
# Used by push_run_to_gdrive and build_submission_message to validate run dirs.

phme20:
  experiment_key_pattern: "phme20/*"
  required_files: [config_resolved.yaml, run_metadata.yaml, REPRODUCE.md, uv.lock]
  description: "PHME20 – prognostics and health management challenge dataset"

pronostia:
  experiment_key_pattern: "pronostia/*"
  required_files: [config_resolved.yaml, run_metadata.yaml, REPRODUCE.md, uv.lock]
  description: "PRONOSTIA – bearing degradation dataset (FEMTO)"

