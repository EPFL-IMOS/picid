site_name: TabPHM
site_url: https://epfl-imos.github.io/TabPHM/
site_description: Prognostics, Health Management (PHM) and Forecasting Benchmark Arena
site_author: EPFL IMOS

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            docstring_style: numpy
            show_docstring_examples: true

nav:
  - Home: index.md
  - Getting started:
    - Setup: setup.md
  - Data:
    - Data objects & containers: dataobject.md
    - Datasets (task-centric): datasets.md
    - Datasets inner workings: datasets_inner_workings.md
    - Datasources: datasources.md
  - Transforms:
    - Overview: transforms.md
    - Quick start: transforms/quick_start.md
    - User guide: transforms/guide.md
    - Developer guide: transforms/developer_guide.md
  - Evaluators:
    - Evaluator subsystem: evaluators/index.md
  - Models & configuration:
    - Model types: model_types.md
    - Adding a new model: how_to_add_a_new_model.md
    - OmegaConf resolvers: how_to_use_configs.md
  - Running:
    - RunAI (cluster): runai.md
    - Dataset viewer: viewer.md
  - API Reference: api.md
  - Archive:
    - Legacy setup (RunAI/Guild): old_setup.md
    - Documentation update plan: DOCUMENTATION_UPDATE_PLAN.md
