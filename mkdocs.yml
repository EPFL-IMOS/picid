site_name: Picid Documentation
site_url: https://anonymous.repository.com
site_description: Prognostics, Health Management (PHM) and Forecasting Benchmark Arena
site_author: anonymous

theme:
    name: material
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.suggest
        - search.highlight

plugins:
    - search
    - mkdocstrings:
          default_handler: python
          handlers:
              python:
                  options:
                      show_source: true
                      docstring_style: numpy
                      show_docstring_examples: true
                      # Improve API rendering
                      separate_signature: true
                      merge_init_into_class: true
                      show_signature_annotations: true
                      members: true
                      inherited_members: false

