site_name: TabPHM
site_url: https://epfl-imos.github.io/TabPHM/
site_description: Prognostics, Health Management (PHM) and Forecasting Benchmark Arena
site_author: EPFL IMOS

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            docstring_style: numpy
            show_docstring_examples: true
            # Improve API rendering
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true
            members: true
            inherited_members: false

nav:
  - Home: index.md
  - Getting started:
    - Overview: getting-started/index.md
    - Setup: getting-started/setup.md
    - Dataset viewer: getting-started/viewer.md
  - Concepts:
    - Overview: concepts/index.md
    - From data to prediction: concepts/from_data_to_prediction.md
  - Guides:
    - Overview: guides/index.md
    - Config and overrides: guides/configs_and_overrides.md
    - Reproducibility: guides/reproducibility.md
    - OmegaConf resolvers: guides/omegaconf_resolvers.md
    - Adding a new model: guides/how_to_add_a_new_model.md
    - RunAI (cluster): guides/runai.md
    - Experiment Generator: guides/experiment_generator.md
    - Submit to Leaderboard: guides/submit_run_to_leaderboard.md
  - Examples:
    - Overview: examples/index.md
    - Unibo battery RUL: examples/unibo_rul.md
  - Reference:
    - Overview: reference/index.md
    - Scripts: reference/scripts.md
    - Datasources: reference/datasources.md
    - Data objects & containers: reference/dataobject.md
    - Datasets: reference/datasets.md
    - Datasets inner workings: reference/datasets_inner_workings.md
    - Transforms: reference/transforms.md
    - Evaluators: reference/evaluators.md
    - Model types: reference/model_types.md
    - API:
      - Package Reference: reference/api/package_reference.md
      - picid.data.data_objects: reference/api/picid_data_data_objects.md
      - picid.data: reference/api/picid_data.md
      - picid.data.datasources: reference/api/picid_data_datasources.md
      - picid.data.datasets: reference/api/picid_data_datasets.md
      - picid.data.datamodules: reference/api/picid_data_datamodules.md
      - picid.transforms.base: reference/api/picid_transforms_base.md
      - picid.model: reference/api/picid_model.md
      - picid.evaluator: reference/api/picid_evaluator.md
      - picid.metrics: reference/api/picid_metrics.md
      - picid.pipeline: reference/api/picid_pipeline.md
      - picid.utils: reference/api/picid_utils.md
  - Transforms (deep dives):
    - Quick start: transforms/quick_start.md
    - User guide: transforms/guide.md
    - Developer guide: transforms/developer_guide.md
    - Hooks examples: transforms/HOOKS_EXAMPLES.md
  - Leaderboard: leaderboard/index.html
