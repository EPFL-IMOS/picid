name: Docs

on:
  push:
    branches: [ "main", "TabPHM-neurips2026-submission" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e ".[dev]"

      - name: Build docs
        run: uv run mkdocs build
