name: Slow & Snapshot Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-and-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_TABPFN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh -T git@github.com || true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
        env:
          GIT_SSH_COMMAND: "ssh -v"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e ".[dev]"

      - name: Download PHME20 (for requires_snapshots tests)
        run: |
          uv run python -c "from phmd.download import download; download('PHME20', cache_dir='datasets/phmd_cache', unzip=True)"

      - name: Run slow and requires_snapshots tests
        run: uv run pytest test/ -m "(slow or requires_snapshots) and not real_data" -v
