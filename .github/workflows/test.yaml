name: Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      # 1. Load the Private Key for TabPFN
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_TABPFN }}

      # 2. Configure SSH to use Port 443
      # This bypasses firewall blocks on Port 22 that cause "Connection refused"
      - name: Configure SSH over Port 443
        run: |
          mkdir -p ~/.ssh
          echo "Host github.com" >> ~/.ssh/config
          echo "  Hostname ssh.github.com" >> ~/.ssh/config
          echo "  Port 443" >> ~/.ssh/config
          echo "  User git" >> ~/.ssh/config
          # Scan keys for ssh.github.com so we don't get "Host key verification failed"
          ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts

      # 3. DEBUG: Test the SSH connection explicitly
      # If this prints "Hi [user]!", your key works. If "Permission denied", key is wrong.
      - name: Test SSH Connection
        run: ssh -T git@github.com || true

      # 4. Checkout Main Repo (Disable auto-submodules)
      # persist-credentials: false -> STOPS GitHub from overriding your SSH setup
      # submodules: false -> We will do this manually below
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      # 5. Manually Update Submodules
      # This ensures Git uses the exact URLs from your .gitmodules file
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 6. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          uv run pytest --cov --cov-report=xml:coverage.xml test/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false