name: Testing

on:
  push:
    branches: [ "main", "neurips2026-submission" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Lean lane tests
        run: |
          uv run pytest test/ -q -m "unit and not optional_dep and not slow and not benchmark and not requires_snapshots"

  full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Full lane tests with coverage (excluding slow/snapshot lanes)
        run: |
          uv run pytest --cov=picid --cov-report=xml:coverage.xml --cov-fail-under=74 test/ -m "not slow and not benchmark and not requires_snapshots"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false
