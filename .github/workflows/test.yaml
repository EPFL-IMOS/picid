name: Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      # 1. Load the Private Key
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_TABPFN }}

      # 2. Checkout Main Repo ONLY
      # persist-credentials: false -> Prevents the action from forcing HTTPS
      # submodules: false -> We will do this manually to ensure SSH is used
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      # 3. DEBUG: Verify Connection
      # This confirms GitHub accepts your key before we try cloning
      - name: Test SSH Connection
        run: ssh -T git@github.com || true
        # '|| true' prevents the workflow from crashing if the welcome message returns exit code 1 (common)

      # 4. Manually Update Submodules
      # This forces Git to use the URL exactly as it is in .gitmodules (SSH)
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 5. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          uv run pytest --cov --cov-report=xml:coverage.xml test/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false