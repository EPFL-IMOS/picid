name: Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"] 

    steps:
      # 1. Checkout Code & Submodules
      # We enable recursive submodules as required by your setup doc.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # If submodules are public or in the same repo, this works.
          # If they are private external repos, see the "Important Note" below.
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Install uv
      # This official action installs uv and handles caching automatically.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3. Set up Python (managed by uv)
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 4. Install Dependencies
      # Mimics your "Update" section: Syncs lock file and installs dev dependencies.
      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e ".[dev]"

      # 5. Run Tests
      # 'uv run' automatically loads the .venv environment, so you don't need 'source .venv/bin/activate'
      - name: Test with pytest
        run: |
          uv run pytest --cov --cov-report=xml:coverage.xml test/

      # 6. Upload Coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false