<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | TabPHM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    .dataset-section { margin-bottom: 3rem; }
    .metric-col { font-variant-numeric: tabular-nums; }
    .rank-1 { font-weight: bold; color: #d4a017; }
    .rank-2 { color: #888; }
    .rank-3 { color: #cd7f32; }
    .reproduce-link { font-size: 0.85rem; }
    .no-submissions { color: #888; font-style: italic; }
    th[data-sort] { cursor: pointer; user-select: none; }
    th[data-sort]:after { content: " ↕"; opacity: 0.4; font-size: 0.8em; }
    th[data-sort].asc:after { content: " ↑"; opacity: 1; }
    th[data-sort].desc:after { content: " ↓"; opacity: 1; }
  </style>
</head>
<body>
  <main class="container">
    <h1>TabPHM Leaderboard</h1>
    <p>
      Results submitted by the community. Each row links to a reproducible run on Google Drive.<br>
      <a href="../guides/submit_run_to_leaderboard/">How to submit your run →</a>
    </p>

    <div id="leaderboard-root">Loading leaderboard...</div>
  </main>

  <script>
    const DATA_URL = './leaderboard_data.json';

    function rankBadge(i) {
      if (i === 0) return '<span class="rank-1">🥇</span>';
      if (i === 1) return '<span class="rank-2">🥈</span>';
      if (i === 2) return '<span class="rank-3">🥉</span>';
      return `${i + 1}`;
    }

    function metricHeaders(rows) {
      const seen = new Set();
      rows.forEach(r => Object.keys(r.metrics).forEach(k => seen.add(k)));
      return [...seen];
    }

    function buildTable(dataset, rows) {
      const metrics = metricHeaders(rows);
      const metricCols = metrics.map(m =>
        `<th data-sort="${m}" data-metric="${m}">${m}</th>`
      ).join('');

      const bodyRows = rows.map((r, i) => {
        const metricCells = metrics.map(m => {
          const v = r.metrics[m];
          return `<td class="metric-col">${v !== undefined ? v.toFixed(4) : '—'}</td>`;
        }).join('');
        const link = r.gdrive_link
          ? `<a class="reproduce-link" href="${r.gdrive_link}" target="_blank" rel="noopener">📂 Run</a>`
          : '<span class="reproduce-link" style="opacity:0.4">—</span>';
        return `<tr>
          <td>${rankBadge(i)}</td>
          <td><code>${r.experiment_key}</code></td>
          <td>${r.submitter}</td>
          <td>${r.timestamp}</td>
          ${metricCells}
          <td>${link}</td>
          <td>${r.notes || ''}</td>
        </tr>`;
      }).join('');

      return `
        <div class="dataset-section">
          <h2>${dataset}</h2>
          <div style="overflow-x:auto">
          <table role="grid">
            <thead>
              <tr>
                <th>#</th>
                <th>Experiment</th>
                <th>Submitter</th>
                <th data-sort="timestamp">Date</th>
                ${metricCols}
                <th>Reproduce</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="tbody-${dataset}">${bodyRows}</tbody>
          </table>
          </div>
        </div>`;
    }

    function addSortHandlers(dataset, rows, metrics) {
      const tbody = document.getElementById(`tbody-${dataset}`);
      document.querySelectorAll(`[data-sort]`).forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.sort;
          const isMetric = th.dataset.metric;
          const asc = !th.classList.contains('asc');
          document.querySelectorAll('th[data-sort]').forEach(h => h.classList.remove('asc', 'desc'));
          th.classList.add(asc ? 'asc' : 'desc');
          const sorted = [...rows].sort((a, b) => {
            const va = isMetric ? (a.metrics[col] ?? Infinity) : (a[col] ?? '');
            const vb = isMetric ? (b.metrics[col] ?? Infinity) : (b[col] ?? '');
            return asc ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
          });
          tbody.innerHTML = sorted.map((r, i) => {
            const metricCells = metrics.map(m => {
              const v = r.metrics[m];
              return `<td class="metric-col">${v !== undefined ? v.toFixed(4) : '—'}</td>`;
            }).join('');
            const link = r.gdrive_link
              ? `<a class="reproduce-link" href="${r.gdrive_link}" target="_blank" rel="noopener">📂 Run</a>`
              : '<span class="reproduce-link" style="opacity:0.4">—</span>';
            return `<tr>
              <td>${rankBadge(i)}</td>
              <td><code>${r.experiment_key}</code></td>
              <td>${r.submitter}</td>
              <td>${r.timestamp}</td>
              ${metricCells}
              <td>${link}</td>
              <td>${r.notes || ''}</td>
            </tr>`;
          }).join('');
        });
      });
    }

    async function init() {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('Failed to load leaderboard_data.json');
      const data = await res.json();
      const root = document.getElementById('leaderboard-root');

      if (!data.datasets || data.datasets.length === 0) {
        root.innerHTML = '<p class="no-submissions">No submissions yet. <a href="../guides/submit_run_to_leaderboard/">Be the first →</a></p>';
        return;
      }

      root.innerHTML = data.datasets.map(d => buildTable(d.dataset, d.rows)).join('');
      data.datasets.forEach(d => {
        const metrics = metricHeaders(d.rows);
        addSortHandlers(d.dataset, d.rows, metrics);
      });
    }

    init().catch(e => {
      document.getElementById('leaderboard-root').innerHTML =
        '<p style="color:red">Error loading leaderboard: ' + e.message + '</p>';
    });
  </script>
</body>
</html>
