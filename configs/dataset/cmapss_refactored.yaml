# Dataset loader config
loader:
  _target_: lmetk.data.datasets.cmapss.CMAPSSDataSource
  
  load_arguments:
    data_folder: CMAPSS
    path: ${paths.data_dir}/${dataset.loader.load_arguments.data_folder}
    n_DS: "FD001"
    mode: "train"
    units: null
    concepts:
      - "HPC"
      - "Fan"
    combined_concepts: false
    binary_concepts: true
    RUL: "linear"
    include_healthy: true
    window_size: 1
    stride: 1

  
  data_splitter:
    _target_: lmetk.data.preprocessing.SimpleSplitter
    train: 8640 # int or float. In case of float it is a percentage of the dataset
    val: 2880 # int or float. In case of float it is a percentage of the dataset
    test: null # int or float, or None. In case of float it is a percentage of the dataset. None means len(dataset) - (train + val)

    # There values will be read from the model parameters similarly to how we deal with data_path.
    seq_len: 384 #384    # window size
    label_len: 96  # overlap size
    pred_len: 96   # prediction size

  
  scalers:

    features:
      _target_: lmetk.data.datasets.cmapss.CMAPSSScaler

    labels:
      _target_: lmetk.data.datasets.cmapss.ConstantScaler
      factor: 0.01