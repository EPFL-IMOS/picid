defaults:
  - base_datamodule_default

# In fit-predict tasks, the batch size must be 1
# Because each fit-predict sample generated by a dataset
# (e.g the FitPredictDataset) is processed independently
# as, for example, it allows to execute n independent tasks
# where the task can be a multi-horizon forecast

train_batch_size: 1
val_batch_size: 1
test_batch_size: 1

# No need to shuffle train as as the whole batch is passed in one iteration
shuffle_train: False

# This must be done in the tabularizer
train_subset_ratio: null
val_subset_ratio: null
test_subset_ratio: null
