#@package _global_

defaults:
# Disable wandb logger to avoid unnecessary network calls during debugging.
  - override /logger: csv

# We aim to shorten the dataset for debugging purposes.
# We do that by using torch Subset which is configured in the datamodule.
# datamodule:
#   subset_range: [0, 16, 1]  # [start, end, step]

datasource:
  debug_cache_dataset: true  
  debug_cache_path: ${paths.data_dir}/debug_cache
  # debug_subset_range: [0, 1000, 1]

trainer:
  accelerator: cpu
  devices: 1

# This will raise the original exception instead of a generic one.
# Making the debugger stop at the error, instead of the wrapper that we have for WANDB termination.
debug: 
  raise_inner_exception: true
