_target_: lmetk.baselines.spacetimeformer_model.Spacetimeformer_Forecaster

metadata:
  lightning_model: true

max_seq_len: 72 # 192 # 120
ts_in: 48
ts_out: 24
d_yc:  1
d_yt:  1
d_x: 56 # 14 + 1 since its concatenated
d_model: 256 # 256
d_ff: 128 # 512
e_layers: 3
d_layers: 3
dropout: 0.1
freq: null # hourly
time_emb_dim: 32
use_x_dim: true
include_x_t: true

use_revin: false
use_seasonal_decomp: false

warmup_steps: 10000
decay_factor: 0.9
init_lr: 1.0e-10
base_lr: 5.0e-4
patience: 5
