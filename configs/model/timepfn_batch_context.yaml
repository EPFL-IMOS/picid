_target_: lmetk.model.wrappers.batchcontext_timepfn_wrapper.BatchContextTimePFNWrapper 

seq_len: ${task_definition.seq_len}      # window size
label_len: ${task_definition.label_len}  # overlap size
pred_len: ${task_definition.pred_len}    # prediction size

# Fixed in the TimePFN model
embed_type: 'fixed'
freq: 'h'

# Parameters default for the given pretrained model
load_path: ./checkpoints/TimePFN/checkpoint.pth
patch_size: 16
embed_dim: 256
factor: 1
dropout: 0.1
n_heads: 8
d_ff: 512
activation: gelu
e_layers: 8
d_model: 1024
use_norm: True
class_strategy: projection
max_channel: 161
# Some configs for testing used in the timepfn


use_amp: False 
# output_attention behaves weirdly, as argparset has True as default but debugger tells it is False and cannot find where it is overwriten
output_attention: False #True
inverse: False


# Additional params needed for wrapper to run:
features_mode: ${datasource.task_mode}
device: 'cuda:0'

