_target_: lmetk.model.wrappers.drift_model_wrapper.DriftModelWrapper

# There values will be read from the model parameters similarly to how we deal with data_path.
seq_len: ${task_definition.seq_len}      # window size
label_len: ${task_definition.label_len}  # overlap size

# Model parameters
pred_len: ${task_definition.pred_len}    # prediction size

# Additional params needed for wrapper to run:
features_mode: ${datasource.load_arguments.features_mode}
device: 'cuda:0'