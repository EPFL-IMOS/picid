local_self_attn: "full"
time_emb_dim: 12
dropout_attn_matrix: 0.0
dropout_qkv: 0.1
dropout_emb: 0.0
dropout_ff: 0.2

pos_emb_type: abs
timetable_emb_type: linear
time_emb_type: linear
