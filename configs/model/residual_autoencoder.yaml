# This is the key to the solution.
# We define a group named 'block_configs' and explicitly tell Hydra
# where to find its files using the special '_group_' key.

_target_: lmetk.model.autoencoder.wrapper.AutoencoderWrapper
task_type: ${task_definition.task_type}

input_channels: null # currently defined in the experiment
input_seq_len: ${task_definition.seq_len}
latent_dim: null # currently defined in the experiment
dropout_prob: null # currently defined in the experiment

output_channels: null # A list of output filters, the lenght of the list is equal to the number of blocks
kernels: null # A list of kernel sizes, the lenght of the list is equal to
strides: null # A list of stride sizes, the lenght of the list is equal to
dilations: null # A list of dilation sizes, the lenght of the list is equal to
# The lenght of the lists above must be equal
