_target_: lmetk.model.wrappers.timepfn_wrapper.TimePFNWrapper 
#lmetk.model.time_pfn.TimePFN.TimePFN

# There values will be read from the model parameters similarly to how we deal with data_path.
seq_len: 96 #${datasource.loader.data_splitter.seq_len}    # window size
label_len: 48 #${datasource.loader.data_splitter.label_len}  # overlap size
pred_len: 96 #${datasource.loader.data_splitter.pred_len}   # prediction size

# Fixed in the TimePFN model
embed_type: 'fixed'
freq: 'h'

# Parameters default for the given pretrained model
load_path: ./checkpoints/TimePFN/checkpoint.pth
patch_size: 16
embed_dim: 256
factor: 1
dropout: 0.1
n_heads: 8
d_ff: 512
activation: gelu
e_layers: 8
d_model: 1024
use_norm: True
class_strategy: projection
max_channel: 161
# Some configs for testing used in the timepfn


use_amp: False 
# output_attention behaves weirdly, as argparset has True as default but debugger tells it is False and cannot find where it is overwriten
output_attention: False #True
inverse: False


# Additional params needed for wrapper to run:
features_mode: ${datasource.loader.load_arguments.features_mode}
device: 'cuda:0'

