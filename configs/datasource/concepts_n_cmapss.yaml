# Dataset loader config
# Must have keys: data_name, task_mode

_target_: picid.data.datasources.concepts_n_cmapss.N_CMAPSSDataSource

# Must have keys
data_name: ${.data_folder}_${.n_DS}
task_mode: rul

# Additional
data_folder: N-CMAPSS
path: ${paths.data_dir}/${.data_folder}
n_DS: "02"
mode: "train"
cruise: false
units: null
subsampling_rate: 1
concepts:
    - "LPT-E"
    - "LPT-F"
    - "HPT-E"
combined_concepts: false
binary_concepts: true
RUL: "linear"
include_healthy: true
window_size: ${task_definition.seq_len}
stride: 1
scaling: "legacy"

# TODO: We currently have no data splitter implemented
# for this dataset to split within an unit.
data_splitter: null
