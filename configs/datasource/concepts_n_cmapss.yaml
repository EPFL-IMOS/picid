# Dataset loader config
# Must have keys: data_name, task_mode

_target_: lmetk.data.datasources.concepts_n_cmapss.N_CMAPSSDataSource

# Must have keys
data_name: ${.data_folder}_${.n_DS}
task_mode: multivariate

# Additional
data_folder: N-CMAPSS
path: ${paths.data_dir}/${.data_folder}
n_DS: "02"
mode: "train"
cruise: false
units: null
subsampling_rate: 1
concepts:
  - "HPC"
  - "Fan"
combined_concepts: false
binary_concepts: true
RUL: "linear"
include_healthy: true
window_size: 50
stride: 1
scaling: "legacy"


data_splitter:
  _target_: lmetk.data.preprocessing.TimeSplitter
  train: 8640 # int or float. In case of float it is a percentage of the dataset
  val: 2880 # int or float. In case of float it is a percentage of the dataset
  test: 2880 # int or float, or None. In case of float it is a percentage of the dataset. None means len(dataset) - (train + val)
  
  # Optional feature: by def. we generate splits for features and timestamps
  create_splits_for: [features, timestamps, health_states, rul, concepts, unit, descriptors]

  # There values will be read from the model parameters similarly to how we deal with data_path.
  seq_len: 96 #384    # window size
  label_len: 48  # overlap size
  pred_len: 96   # prediction size

