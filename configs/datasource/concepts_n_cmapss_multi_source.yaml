defaults:
  - /datasource@train1: concepts_n_cmapss
  - /datasource@train2: concepts_n_cmapss
  - /datasource@train3: concepts_n_cmapss
  - /datasource@train4: concepts_n_cmapss

  - /datasource@test1: concepts_n_cmapss
  - /datasource@test2: concepts_n_cmapss
  - /datasource@test3: concepts_n_cmapss
  - /datasource@test4: concepts_n_cmapss


_target_: lmetk.data.datasources.multi_source_pipeline.MultiSourcePipeline

load_arguments: null


data_splitter: 
  _target_: lmetk.data.preprocessing.BySourceSplitter
  sources_train: [train1, train2, train3, train4]
  sources_test: [test1, test2, test3, test4]
  sources_val: [] # TODO: why are there no val test sources in the original setup?


scalers:

  features:
    _target_: lmetk.data.datasources.concepts_cmapss.CMAPSSScaler

  rul:
    _target_: lmetk.data.datasources.concepts_cmapss.ConstantScaler
    factor: 0.01

# Setup taken over from https://github.com/EPFL-IMOS/concept-prognostics/tree/main

_train_load_args: &train_args
  units: [1,2,3,4,5,6]
  mode: "train"

_test_load_args: &test_args
  units: [7,8,9,10]
  mode: "test"

train1:
  load_arguments:
    n_DS: "01"
    <<: *train_args
train2:
  load_arguments:
    n_DS: "04"
    <<: *train_args
train3:
  load_arguments:
    n_DS: "05"
    <<: *train_args
train4:
  load_arguments:
    n_DS: "07"
    <<: *train_args

test1:
  load_arguments:
    n_DS: "01"
    <<: *test_args
test2:
  load_arguments:
    n_DS: "04"
    <<: *test_args
test3:
  load_arguments:
    n_DS: "05"
    <<: *test_args
test4:
  load_arguments:
    n_DS: "07"
    <<: *test_args


source_list:
  train1: ${..train1}
  train2: ${..train2}
  train3: ${..train3}
  train4: ${..train4}

  test1: ${..test1}
  test2: ${..test2}
  test3: ${..test3}
  test4: ${..test4}