# Dataset loader config
_target_: lmetk.data.datasources.ETThLoader

load_arguments:
  data_name: ETTh1
  data_folder: ETT-small
  data_path: ${paths.data_dir}/${datasource.load_arguments.data_folder}/${datasource.load_arguments.data_name}.csv
  
  flag: train
  size: null 
  
  features_mode: S
  target_name: OT
  
  scale: True
  timeenc: railway_timefeatures # Optiona: railway_timefeatures, timepfn_timefeatures
  freq: h 

  timestamp_name: date
  time_features: ["month", "day", "weekday", "hour"]
  normalize_time_features: False

data_splitter:
  _target_: lmetk.data.preprocessing.SimpleSplitter
  train: 8640 # int or float. In case of float it is a percentage of the dataset
  val: 2880 # int or float. In case of float it is a percentage of the dataset
  test: null # int or float, or None. In case of float it is a percentage of the datasource. None means len(dataset) - (train + val)

  # There values will be read from the model parameters similarly to how we deal with data_path.
  seq_len: 96 #384 #384    # window size
  label_len: 48 #96  # overlap size
  pred_len: 96   # prediction size

# data = {features: {train, val, test}}
# 1. train Tr_num , val: N - Tr_num + label_len, 
# 2. train Tr_num , val: N - Tr_num, 

# data {features, train_splits} -> train Tr_num , val: N - Tr_num, 

# train Tr_num , val: N - Tr_num,


