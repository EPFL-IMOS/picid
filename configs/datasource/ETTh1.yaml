# Dataset loader config
_target_: lmetk.data.datasources.ETThLoader

data_name: ETTh1
data_folder: ETT-small
data_path: ${paths.data_dir}/${.data_folder}/${.data_name}.csv

task_mode: univariate
target_name: OT
timestamp_name: date
# scale: True

data_splitter:
  _target_: lmetk.data.preprocessing.TimeSplitter
  splitter_type: TimeSplitter
  train: 8640 # int or float. In case of float it is a percentage of the dataset
  val: 2880 # int or float. In case of float it is a percentage of the dataset
  test: null # int or float, or None. In case of float it is a percentage of the datasource. None means len(dataset) - (train + val)
  
  # There values will be read from the model parameters similarly to how we deal with data_path.
  seq_len: ${oc.select:model.seq_len,null}     # 96   # 384  # window size
  label_len: ${oc.select:model.label_len,null} # 48 # 96  # overlap size
  pred_len:  ${oc.select:model.pred_len,null}  #96  # prediction size

data_default_transforms:
  scaler:
    transform:
      _target_: lmetk.transforms.base_transform.SklearnStandardScalerAdapter # Your wrapper class
    
    metadata:
      apply_to: features
      fit_on: train
  
  time_features_transform:
    transform:
      _target_: lmetk.transforms.timefeatures.TimePFNTimeFeaturesTransform
      freq: h 
    
    metadata:
      apply_to:  timestamps


transforms:
  scaler2:
    transform:
      _target_: lmetk.transforms.base_transform.SklearnStandardScalerAdapter # Your wrapper class
    
    metadata:
      apply_to: features
      fit_on: train 



  
