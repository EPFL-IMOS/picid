_target_: lmetk.data.datasources.RailwayLoader


data_name: railway
data_folder: railway
data_path: ${paths.data_dir}/${.data_folder}/${.data_name}.csv

samples_per_day: 24
target_name: Bahnlast
timestamp_name: datetime

# In case true, define trend_decomp_rolling_window
trend_decomp: False
trend_decomp_rolling_window: null

# Need to be discussed
task_mode: univariate
mode_mode: context
  
data_splitter:
  _target_: lmetk.data.preprocessing.TimeStampSplitter
  splitter_type: TimeStampSplitter
  test_start: "2023-01-24 00:00:00"
  train_ratio: 0.9 
  val_ratio: 0.1 
  create_splits_for: [features, timestamps, target, initial_dates]

  
  # There values will be read from the model parameters similarly to how we deal with data_path.
  seq_len: ${oc.select:model.seq_len,null}     # 96   # 384  # window size
  label_len: ${oc.select:model.label_len,null} # 48 # 96  # overlap size
  pred_len:  ${oc.select:model.pred_len,null}  #96  # prediction size
  apply_lookback: True

data_default_transforms:
  scaler_features:
    transform:
      _target_: lmetk.transforms.base_transform.SklearnMinMaxScalerAdapter # Your wrapper class
    
    metadata:
      apply_to: features
      fit_on: train
  
  scaler_target:
    transform:
      _target_: lmetk.transforms.base_transform.SklearnMinMaxScalerAdapter # Your wrapper class
    
    metadata:
      apply_to: target
      fit_on: train
  
  time_features_transform:
    transform:
      _target_: lmetk.transforms.timefeatures_railway.RailwayTimeFeaturesTransform
      use_features: ["year", "month", "day", "weekday", "hour"]
      normalize_time_features: False
    
    metadata:
      apply_to:  timestamps
