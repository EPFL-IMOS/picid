# These transforms adapted from the TimePFN paper
scaler:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.StandardScalerSklearn 
  
  metadata:
    apply_to: features
    
    assign_to: 
      scaled_features: features_2

    fit_on: train

time_features_transform:
  transform:
      _target_: lmetk.transforms.base_transforms.timefeatures.TimePFNTimeFeaturesTransform
      freq: h 

  metadata:
    apply_to: timestamps    
    assign_to: time_features


