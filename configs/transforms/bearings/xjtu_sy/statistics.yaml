scaler_features:
  transform:
    _target_: picid.transforms.base_transforms.scaler.StandardScalerSklearn

  metadata:
    apply_to: features
    fit_on: train

take_last_target:
  transform:
    _target_: picid.transforms.base_transforms.subsample.WindowedAggregationTransform
    step: 1 # TO BE CHANGED SOMEHOW
    window_size: full
    aggregation: last
    dim: 1
  metadata:
    apply_to: target

# Reduce target dim
reshape_target:
  transform:
    _target_: picid.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a 1 1 -> a 1"
  metadata:
    apply_to: target

scaler_target:
  transform:
    _target_: picid.transforms.bearings.health_index.HealthIndexTransform
    runtime_key: target
    unit_key: unit_id
    dataset_name: XJTU-SY

  metadata:
    apply_to: ["target", "unit_id"]
    assign_to: rul

time_domain_features:
  transform:
    _target_: picid.transforms.base_transforms.time_statistics.TimeStatsTransform
    stats_to_compute: [
        "mean",
        "maximum",
        "minimum",
        "root_mean_square",
        "abs_avg", # Defined as a wrapper for root_mean_square in the source
        "peak_to_peak_value",
        "standard_deviation",
        "skewness",
        "kurtosis",
        "variance",
        "peak_factor",
        "change_coefficient", # Note: This is mean / std
        "clearance_factor",
        "abs_energy",
      ]

  metadata:
    apply_to: "features"

ragged2regularragged:
  transform:
    _target_: picid.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: "features"

final_scaler_features:
  transform:
    _target_: picid.transforms.base_transforms.scaler.MinMaxScalerSklearn

  metadata:
    apply_to: features
    fit_on: train

