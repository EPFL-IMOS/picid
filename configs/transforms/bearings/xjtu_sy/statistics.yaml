# Autoencoder transform 
scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.StandardScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train
    additional_metadata_keys: 
      ragged_dim: 1

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    assign_to: rul
    fit_on: train

sequence2statistics:
  transform:
    _target_: lmetk.transforms.battery.sequence2statistics.Sequence2Statistics
    padding_value: null
    silent_logger: true

  metadata:
    apply_to: 'features'