scaler_target:
  transform:
    _target_: picid.transforms.bearings.health_index.HealthIndexTransform
    runtime_key: target
    unit_key: unit_id
    dataset_name: XJTU-SY

  metadata:
    apply_to: ['target','unit_id']
    assign_to: rul

scaler_features:
  transform:
    _target_:  picid.transforms.base_transforms.scaler.StandardScalerSklearn

  metadata:
    apply_to: features
    fit_on: train


spectral:
  transform:
    _target_: picid.transforms.base_transforms.spectral.SpectralStatsTransform
    stats_to_compute: ["mean",
        "maximum",
        "minimum",
        "root_mean_square",
        "peak_to_peak_value",
        "variance",
        "skewness",
        "kurtosis",
        "abs_energy",
        # rul_features inspired
        "peak_factor",
        "change_coefficient",
        "clearance_factor",
        # Entropy stats
        "spectral_entropy",
        "shannon_entropy",
        "permutation_entropy",]

  metadata:
    apply_to: 'features'
    assign_to: 'features'



sequence2statistics:
  transform:
    _target_: picid.transforms.battery.sequence2statistics.Sequence2Statistics
    padding_value: null

  metadata:
    apply_to: 'features'

ragged2regularragged:
  transform:
    _target_: picid.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'
