scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.StandardScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    assign_to: rul
    fit_on: train
  
sequence2statistics:
  transform:
    _target_: lmetk.transforms.base_transforms.time_statistics.TimeStatsTransform
    stats_to_compute: ["mean",
        "maximum",
        "minimum",
        "root_mean_square",
        "abs_avg",  # Defined as a wrapper for root_mean_square in the source
        "peak_to_peak_value",
        "standard_deviation",
        "skewness",
        "kurtosis",
        "variance",
        "peak_factor",
        "change_coefficient",  # Note: This is mean / std
        "clearance_factor",
        "abs_energy",]

  metadata:
    apply_to: 'features'


ragged2regularragged:
  transform:
    _target_: lmetk.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'