cut_to_first_zero_target:
  transform:
    _target_: lmetk.transforms.bearings.old.cut_till_first_zero.RULTaskUpToFirstZero

  metadata:
    apply_to: ["target", "features"]
    assign_to:
      target: target
      features: features

# Autoencoder transform
scaler_features:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.StandardScalerSklearn

  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn

  metadata:
    apply_to: target
    fit_on: train

autoencoder:
  transform:
    _target_: lmetk.transforms.bearings.autoencoder_transform.BearingAutoencoderTransform # Your wrapper class
    folder_name: ${paths.root_dir}/artifacts/debug/runs/pronostia+reconstruction+residual_autoencoder/2025-10-06_15-07-59
    batch_size: 32000

  metadata:
    apply_to: ["features", "target"]
    assign_to:
      features: features
      target: rul
