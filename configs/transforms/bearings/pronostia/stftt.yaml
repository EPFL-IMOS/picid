scaler_features:
  transform:
    _target_:  picid.transforms.base_transforms.scaler.StandardScalerSklearn

  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: picid.transforms.base_transforms.scaler.MinMaxScalerSklearn

  metadata:
    apply_to: target
    assign_to: rul
    fit_on: train

stfft:
  transform:
    _target_: picid.transforms.base_transforms.stfft.STFTTransform
    win_len: 128
    hop: 64

  metadata:
    apply_to: 'features'
    assign_to: 'features'

sequence2statistics:
  transform:
    _target_: picid.transforms.battery.sequence2statistics.Sequence2Statistics
    padding_value: null

  metadata:
    apply_to: 'features'

ragged2regularragged:
  transform:
    _target_: picid.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'
