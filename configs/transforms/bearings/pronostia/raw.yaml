# as features have 1st var dim then we first have to regularize then use reshape_x
ragged2regularragged3:
  transform:
    _target_: lmetk.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'

reshape_x_for_health_index:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b c -> (a b) c"
  metadata:
    apply_to: features
    assign_to: features_flatten

moving_average:
  transform:
    _target_: lmetk.transforms.base_transforms.moving_average.MovingAverageTransform
    window_size: 2560
    chunk_size: 2560
    causal: True
  
  metadata:
    apply_to: features_flatten
    assign_to: features_flatten 

features2RMS:
  transform:
    _target_: lmetk.transforms.signal_processing.rms.MovingRMSTransform
    window_size: 2560
    apply_to_columns: True
    save_images: True
    saving_path: ${paths.log_dir}/rms_images
    unit_key: unit_id
  
  metadata:
    apply_to: ['features_flatten', 'unit_id']
    assign_to: index


