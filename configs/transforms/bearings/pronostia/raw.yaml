


reshape_y:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b c -> (a b) c"
  metadata:
    apply_to: target
    assign_to: target


# as features have 1st var dim then we first have to regularize then use reshape_x
ragged2regularragged3:
  transform:
    _target_: lmetk.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'

reshape_x:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b c -> (a b) c"
  metadata:
    apply_to: features
    assign_to: features



features2RMS:

  transform:
    _target_: lmetk.transforms.signal_processing.rms.MovingRMSTransform
    window_size: 2560
    apply_to_columns: True
    save_images: True
    saving_path: ${paths.log_dir}/rms_images
    unit_key: unit_id
  
  metadata:
    apply_to: ['features', 'unit_id']
    assign_to: index



scaler_target:
  transform:
    _target_: lmetk.transforms.bearings.health_index.HealthIndexTransform
    runtime_key: target
    unit_key: unit_id
    dataset_name: PRONOSTIA

  metadata:
    apply_to: ['target','unit_id']
    assign_to: rul

scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.StandardScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train



