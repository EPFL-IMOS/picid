li2019_features:
  transform:
    _target_: lmetk.transforms.bearings.health_models.li2019.Li2019FPTCutTransform
    signal_key: index
    features_keys: ['features']
    normal_period_end: 200
    window_size: 200
    fpt_indexes_strategy: min
    dataset_name: PRONOSTIA
    unit_id_key: unit_id
    use_predefined_test: True

  metadata:
    apply_to: ['features', 'index', unit_id]
    assign_to: ['features']

li2019_target:
  transform:
    _target_: lmetk.transforms.bearings.health_models.li2019.Li2019FPTCutTransform
    signal_key: index
    features_keys: ['target']
    normal_period_end: 200
    window_size: 200
    fpt_indexes_strategy: min
    dataset_name: PRONOSTIA
    unit_id_key: unit_id
    use_predefined_test: True

  metadata:
    apply_to: ['target', 'index', unit_id]
    assign_to: ['target']


reshape_y:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b c -> (a b) c"
  metadata:
    apply_to: target
    assign_to: target

scaler_target:
  transform:
    _target_: lmetk.transforms.bearings.health_index.HealthIndexTransform
    runtime_key: target
    unit_key: unit_id
    dataset_name: PRONOSTIA

  metadata:
    apply_to: ['target','unit_id']
    assign_to: rul

reshape_x:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b c -> (a b) c"
  metadata:
    apply_to: features
    assign_to: features

scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.StandardScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train



