subsample_features_target:
  transform:
    _target_: lmetk.transforms.base_transforms.subsample.WindowedAggregationTransform
    step: 60
    window_size: 60
    aggregation: mean
  metadata:
    apply_to: features

subsample_others:
  transform:
    _target_: lmetk.transforms.base_transforms.subsample.WindowedAggregationTransform
    step: 60
    window_size: 60
    aggregation: last
  metadata:
    apply_to: target
    assign_to:
      target: fault_classification