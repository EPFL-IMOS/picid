defaults:
  - mzvav/default@_here_

tabularize_x_train:
  # Concatenate time-features to the feature set
  transform:
    _target_: picid.transforms.base_transforms.tabularizers.TimeseriesTabularizer
    seq_len: ${task_definition.seq_len}
    label_len: ${task_definition.label_len}
    pred_len: ${task_definition.pred_len}
    stride: ${task_definition.stride_train}
    padding_left_flag: ${task_definition.padding_left_flag}
    subset_ratio: ${oc.select:task_definition.subset_ratio,null}
    subset_seed: ${oc.select:task_definition.subset_seed,null}
    subset_blocks: ${oc.select:task_definition.subset_blocks,null}
    timestep_dimension: 1

    select_features:
      - features: history

  metadata:
    apply_to: ["features"]
    assign_to: features
    transform_on_keys: ["train"]

tabularize_x_val_test:
  # Concatenate time-features to the feature set
  transform:
    _target_: picid.transforms.base_transforms.tabularizers.TimeseriesTabularizer
    seq_len: ${task_definition.seq_len}
    label_len: ${task_definition.label_len}
    pred_len: ${task_definition.pred_len}
    stride: ${task_definition.stride}
    padding_left_flag: ${task_definition.padding_left_flag}
    timestep_dimension: 1

    select_features:
      - features: history

  metadata:
    apply_to: ["features"]
    assign_to: features
    transform_on_keys: ["val", "test"]

tabularize_y_train:
  # Concatenate time-features to the feature set
  transform:
    _target_: picid.transforms.base_transforms.tabularizers.TimeseriesTabularizer
    seq_len: ${task_definition.seq_len}
    label_len: ${task_definition.label_len}
    pred_len: ${task_definition.pred_len}
    stride: ${task_definition.stride_train}
    padding_left_flag: ${task_definition.padding_left_flag}
    subset_ratio: ${oc.select:task_definition.subset_ratio,null}
    subset_seed: ${oc.select:task_definition.subset_seed,null}
    subset_blocks: ${oc.select:task_definition.subset_blocks,null}
    timestep_dimension: 1

    select_features:
      - fault_classification: present

  metadata:
    apply_to: fault_classification
    assign_to: fault_classification
    transform_on_keys: ["train"]

tabularize_y_val_test:
  # Concatenate time-features to the feature set
  transform:
    _target_: picid.transforms.base_transforms.tabularizers.TimeseriesTabularizer
    seq_len: ${task_definition.seq_len}
    label_len: ${task_definition.label_len}
    pred_len: ${task_definition.pred_len}
    stride: ${task_definition.stride}
    padding_left_flag: ${task_definition.padding_left_flag}
    timestep_dimension: 1

    select_features:
      - fault_classification: present

  metadata:
    apply_to: fault_classification
    assign_to: fault_classification
    transform_on_keys: ["val", "test"]

