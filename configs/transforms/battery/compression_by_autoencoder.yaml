
scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train

# defaults:
#   - bosello_NB_autoencoder

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train


autoencoder:
  transform:
    _target_:  lmetk.transforms.battery.autoencoder_transform.AutoencoderTransform  # Your wrapper class
    folder_name: ${paths.root_dir}/artifacts/debug/runs/unibo+reconstruction+residual_autoencoder/2025-09-24_03-48-04

  metadata:
    apply_to: ['features', 'target']
    assign_to: 
      features: features
      target: rul
  

sequence2statistics:
  transform:
    _target_: lmetk.transforms.battery.sequence2statistics.Sequence2Statistics
    padding_value: null

  metadata:
    apply_to: 'features'
      


