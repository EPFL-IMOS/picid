plot_features:
  transform:
    unit_key: unit_id
    _target_: lmetk.transforms.visualization.features_target_plotter.FeatureTargetPlotter
    saving_path: ${paths.log_dir}/images
    features_key: features
    target_key: target
  
  metadata:
    apply_to: ["features", "target", "unit_id"]    

scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train
    assign_to: rul



# Why do we have this transform now? To make dataset batching work over the dim=0 (in other words the first unraged dimension)
ragged2regularragged:
  transform:
    _target_: lmetk.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'