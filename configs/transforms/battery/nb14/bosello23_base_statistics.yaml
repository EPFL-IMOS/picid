scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train
    assign_to: rul

