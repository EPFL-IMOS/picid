filter_features:
  transform:
    _target_:  lmetk.transforms.battery.nb1_transforms.NB1_filtering  # Your wrapper class
    columns_to_keep: ['voltage', 'current', 'temperature'] # 'mode',

  metadata:
    apply_to: features

scaler_features:
  transform:
    _target_:  lmetk.transforms.battery.scaler.StandardScalerSklearn  # Your wrapper class
    
  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.battery.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train


