scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train


scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train

cycles2sequence:
  transform:
    _target_: lmetk.transforms.battery.cycles2sequence.Cycles2Sequence
    win_len: 32
    pad_value: -1
  
  metadata:
    apply_to: ['features', 'target', 'metadata']
    assign_to: ['features', 'target']
    
sequence2statistics:
  transform:
    _target_: lmetk.transforms.battery.sequence2statistics.Sequence2Statistics
    padding_value: ${transforms.cycles2sequence.transform.pad_value}
  
  metadata:
    apply_to: 'features'
    

