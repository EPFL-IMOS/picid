filter_features:
  transform:
    _target_:  lmetk.transforms.battery.nb1_transforms.FilterDataFrameColumns  
    columns_to_keep: ['voltage', 'current', 'temperature'] 
    apply_to_key: features

  metadata:
    apply_to: ${transforms.filter_features.transform.apply_to_key}



scaler_features:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train


scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train