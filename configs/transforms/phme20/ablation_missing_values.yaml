
mcar_corruption_train_val:
  transform:
    _target_: picid.transforms.base_transforms.mcar_corruption.MCARCorruptorTransform
    ratios: [0.5, 0.5, 0.5, 0.5, 0.5]
    mode: "block"
    block_params:
      min_size: 0.01
      max_size: 0.2

  metadata:
    apply_to: features
    transform_on_keys: ["train", "val"]
    # This transforms introduces NaN into data which violates integrity checks, hence we turn off the validation for this transform
    validate_output: False

mcar_corruption_test:
  transform:
    _target_: picid.transforms.base_transforms.mcar_corruption.MCARCorruptorTransform
    ratios: [0.5, 0.5, 0.5, 0.5, 0.5]
    mode: "block"
    block_params:
      min_size: 0.01
      max_size: 0.2

  metadata:
    apply_to: features
    transform_on_keys: ["test"]
    # This transforms introduces NaN into data which violates integrity checks, hence we turn off the validation for this transform
    validate_output: False

missing_values_analytics:
  transform:
    _target_: picid.transforms.analytics.missing_values.MissingValuesStatsLogger
    saving_path: ${paths.log_dir}/missing_values_stats

  metadata:
    apply_to: features
    # This transforms introduces NaN into data which violates integrity checks, hence we turn off the validation for this transform
    validate_output: False

imputation:
  transform:
    _target_: picid.transforms.base_transforms.imputation_methods.ImputationTransform
    strategy: ["locf", "locf", "spectral", "locf", "locf"]
  metadata:
    fit_on: train
    apply_to: features
    # This transforms introduces NaN into data which violates integrity checks, hence we turn off the validation for this transform
    validate_output: False

