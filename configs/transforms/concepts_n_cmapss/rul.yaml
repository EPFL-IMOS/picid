# These scalers are pre-computed and do not need to be fitted on the data.
defaults:
  - concepts_n_cmapss/default@_here_

subsample:
  transform:
    _target_: lmetk.transforms.base_transforms.subsample.WindowedAggregationTransform
    step: 60
    window_size: 60
    aggregation: mean
  metadata:
    apply_to: [features, descriptors, rul]

# Introduce the task dimension to X, y. We
reshape_X:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b -> 1 a b"
  metadata:
    apply_to: features
    assign_to: X

reshape_y:
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b -> 1 a b"
  metadata:
    apply_to: rul
    assign_to: y
