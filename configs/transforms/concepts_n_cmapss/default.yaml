# These scalers are pre-computed and do not need to be fitted on the data.
scaler_features:
  transform:
    _target_:  lmetk.transforms.n_cmapss.n_cmapss_scalers.N_CMAPSSFeaturesScaler  # Your wrapper class
    scaling: standard

  metadata:
    apply_to: features

scaler_descriptors:
  transform:
    _target_:  lmetk.transforms.n_cmapss.n_cmapss_scalers.N_CMAPSSDescriptorsScaler # Your wrapper class
    scaling: standard
    
  metadata:
    apply_to: descriptors
    
scaler_rul:
  transform:
    _target_:  lmetk.transforms.base_transforms.scaler.ConstantScaler # Your wrapper class
    factor: 0.01
    
  metadata:
    apply_to: rul

subsample:
  transform:
    _target_: lmetk.transforms.base_transforms.subsample.WindowedAggregationTransform
    step: 60
    window_size: 60 
    aggregation: mean
  metadata:
    apply_to: [features, descriptors, rul]

# Introduce the task dimension to X, y. We
reshape_X: 
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b -> 1 a b"
  metadata:
    apply_to: features
    assign_to: X

reshape_y: 
  transform:
    _target_: lmetk.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b -> 1 a b"
  metadata:
    apply_to: rul
    assign_to: y