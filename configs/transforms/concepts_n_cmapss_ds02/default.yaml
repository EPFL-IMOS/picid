# These scalers are pre-computed and do not need to be fitted on the data.
scaler_features:
  transform:
    _target_: lmetk.transforms.n_cmapss.n_cmapss_scalers.N_CMAPSSFeaturesScaler # Your wrapper class
    scaling: standard

  metadata:
    apply_to: features

scaler_descriptors:
  transform:
    _target_: lmetk.transforms.n_cmapss.n_cmapss_scalers.N_CMAPSSDescriptorsScaler # Your wrapper class
    scaling: standard

  metadata:
    apply_to: descriptors

scaler_rul:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.ConstantScaler # Your wrapper class
    factor: 0.01

  metadata:
    apply_to: rul

subsample:
  transform:
    _target_: lmetk.transforms.base_transforms.subsample.SubsampleTransform
    step: 10 # Keep every data point (no subsampling)
  metadata:
    apply_to: [features, descriptors, rul]
    # assign_to: [features, descriptors, rul]
