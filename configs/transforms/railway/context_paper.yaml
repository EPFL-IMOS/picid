scaler_features:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn

  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn

  metadata:
    apply_to: target
    fit_on: train

time_features_transform:
  transform:
    _target_: lmetk.transforms.railway.timefeatures_railway.RailwayTimeFeaturesTransform
    use_features: ["year", "month", "day", "weekday", "hour"]
    normalize_time_features: False

  metadata:
    apply_to: timestamps
    assign_to: time_features

scaler_timefeatures:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.StandardScalerSklearn

  metadata:
    apply_to: time_features
    fit_on: train

concatenate_features:
  # Concatenate time-features to the feature set
  transform:
    _target_: lmetk.transforms.base_transforms.concatenate.ConcatenateTransform

  metadata:
    apply_to: ["features", "time_features"]
    assign_to: features

tabularize_x:
  # Concatenate time-features to the feature set
  transform:
    _target_: lmetk.transforms.base_transforms.tabularizers.TimeseriesTabularizer
    seq_len: ${task_definition.seq_len}
    label_len: ${task_definition.label_len}
    pred_len: ${task_definition.pred_len}
    stride: 1
    timestep_dimension: 1

    # "Say what you want and when"
    # t is the prediction time index
    #  history: all time steps up to and including present
    #  horizon: all time steps to predict
    select_features:
      - time_features: t
      - features: t
      - target: history

  metadata:
    apply_to: ["features", "time_features", "target"]
    assign_to: "features"

tabularize_y:
  # Concatenate time-features to the feature set
  transform:
    _target_: lmetk.transforms.base_transforms.tabularizers.TimeseriesTabularizer
    seq_len: ${task_definition.seq_len}
    label_len: ${task_definition.label_len}
    pred_len: ${task_definition.pred_len}
    stride: 1
    timestep_dimension: 1

    select_features:
      - target: horizon

  metadata:
    apply_to: ["target"]
    assign_to: "target"
