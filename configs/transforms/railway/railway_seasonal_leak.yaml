
scaler_features:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn #lmetk.transforms.base_transform.SklearnMinMaxScalerAdapter 
  
  metadata:
    apply_to: features
    fit_on: train

scaler_target:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.MinMaxScalerSklearn #lmetk.transforms.base_transforms.SklearnMinMaxScalerAdapter 
  
  metadata:
    apply_to: target
    fit_on: train

seasonal_leak:
# Note that shift is infered from the seq_len of the model. Dummy shift supports only 168, otherwise the shift breaks the week symmetry. 
  transform:
    _target_: lmetk.transforms.railway.seasonal_dummy_railway.SeasonalDummyTransform #lmetk.transforms.dummy_railway.RailwayDummyTransform
    shift: ${oc.select:task_definition.seq_len} # we have to ensure that context from target do not have any future information!
  
  metadata:
    apply_to: features
    #fit_on: train
    auxiliary_keys: ['target', 'initial_dates']      

time_features_transform:
  transform:
    _target_: lmetk.transforms.railway.timefeatures_railway.RailwayTimeFeaturesTransform
    use_features: ["year", "month", "day", "weekday", "hour"]
    normalize_time_features: False
  
  metadata:
    apply_to: time_features

scaler_timefeatures:
  transform:
    _target_: lmetk.transforms.base_transforms.scaler.SklearnStandardScalerAdapter 
  
  metadata:
    apply_to: time_features
    fit_on: train

concatenate_features:
  # Concatenate time-features to the feature set
  transform:
    _target_: lmetk.transforms.base_transforms.concatenate.ConcatenateTransform
  
  metadata:
    apply_to: features
    auxiliary_keys: ['time_features'] 

