#@package _global_

defaults:
  - override /dataset: context_batch
  - override /datamodule: base_datamodule
  - override /model: stf
  - override /optimization: warmup_reduce_on_plateau

task_definition:
  requires_training: true

model:
  max_seq_len: ${sum:${task_definition.seq_len},${task_definition.pred_len}}
  d_yc: ${infer_data_dim:target,-1}
  d_yt: ${infer_data_dim:target,-1}
  d_x: ${infer_data_dim:features,-1}
  # TODO: replace with actual timefeatures when available
  n_timefeatures: ${infer_data_dim:time_features,-1}

optimization:
  scheduler:
    factor: 0.95
