#@package _global_

defaults:
  - override /dataset: diagnostics/fault_classification_multiunit_dataset
  - override /datamodule: base_datamodule
  - override /model: patchtst
  - override /optimization: warmup_reduce_on_plateau

task_definition:
  requires_training: true

callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

model:
  ts_in: ${task_definition.seq_len}
  ts_out: ${task_definition.pred_len}
  d_yc: 0
  d_yt: ${task_definition.num_classes}
  d_x: ${infer_data_dim:features,-1}
  include_x_t: false
