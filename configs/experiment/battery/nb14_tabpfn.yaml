#@package _global_

defaults:
  - override /datasource: nb14_battery
  - override /transforms: battery/bosello_NB_base
  - override /model: tabpfn_refactor
  - override /dataset: battery_rul_multiunit_dataset
  - override /datamodule: base_datamodule_tabpfn
  - override /evaluator: default
  - override /task_definition: battery_phmd

task_definition: 
  requires_training: false


evaluator:
  train:
    apply_inverse_scaling: True
  
  val:
    apply_inverse_scaling: True
  
  test:
    apply_inverse_scaling: True

transforms:
  filter_features:
    transform: 
      columns_to_keep: ['voltage_mean', 'voltage_var', 'current_mean','current_var']

