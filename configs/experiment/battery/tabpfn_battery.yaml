# @package _global_
defaults:
  - override /datasource: battery
  - override /dataset: context_batch
  - override /datamodule: context_datamodule
  - override /model: tabpfn_refactor
  - override /evaluator: default
  
evaluator: 
  task_mode: univariate
  target_dim_position: -1
  apply_inverse_scaling: False

dataset:
  stride: 500

model: 
  seq_len: 500
  pred_len: 500



datasource: 
  data_default_transforms:
    scaler_features:
      transform:
        _target_: lmetk.transforms.base_transform.SklearnMinMaxScalerAdapter 
      
      metadata:
        apply_to: features
        fit_on: train
    
    scaler_target:
      transform:
        _target_: lmetk.transforms.base_transform.SklearnMinMaxScalerAdapter 
      
      metadata:
        apply_to: target
        fit_on: train  
    
    scaler_timefeatures:
      transform:
        _target_: lmetk.transforms.base_transform.SklearnMinMaxScalerAdapter 
      
      metadata:
        apply_to: timestamps
        fit_on: train
  
    concatenate_features:
      transform:
        _target_: lmetk.transforms.concatenate.ConcatenateTransform
      
      metadata:
        apply_to: features
        auxiliary_keys: ['timestamps'] 
    
    dummy_leak:
      # Note that for time_pfn we use dummy leak with shift 24 (the same as effective prediction length)
      transform:
        _target_: lmetk.transforms.battery_transform.BatteryTransform #
        shift: ${model.pred_len} # we have to ensure that context from target do not have any future information!
      
      metadata:
        apply_to: features
        auxiliary_keys: ['target', 'initial_dates']    
      