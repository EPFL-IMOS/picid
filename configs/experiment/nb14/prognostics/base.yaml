#@package _global_

defaults:
  - override /evaluator: default
  - override /task_definition: prognostics/rul


callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

evaluator:
  train:
    apply_inverse_scaling: True
  
  val:
    apply_inverse_scaling: True
  
  test:
    apply_inverse_scaling: True