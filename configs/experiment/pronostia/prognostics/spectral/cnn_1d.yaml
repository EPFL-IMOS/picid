#@package _global_

defaults:
  - pronostia/prognostics/base
  - /model_configs/prognostics/cnn_1d

  - override /dataset: prognostics/rul_multiunit_dataset
  - override /transforms: bearings/pronostia/spectral



model:
  seq_len: ${task_definition.seq_len}
  input_channels: ${infer_data_dim:features,-1}
  # CNN_1D_DILATED, Receptive Field is 65
  output_channels: [16,32,64,64,64]
  kernels: [20,20,20,20,20]
  strides: [1,1,1,1,1]
  dilations: [1,2,4,8,1]
  latent_dim: 32
  dropout_prob: 0.5
