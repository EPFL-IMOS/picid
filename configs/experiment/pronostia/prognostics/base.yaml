#@package _global_

defaults:
  - override /datasource: pronostia
  - override /evaluator: per_unit
  - override /task_definition: prognostics/rul

evaluator:
  train:
    inverse_transform_name: scaler_target
    metric_names: ["mape", "phm_score", "mae", "mse", "rmse"]
    apply_inverse_scaling: True
  val:
    inverse_transform_name: scaler_target
    metric_names: ["mape", "phm_score", "mae", "mse", "rmse"]
    apply_inverse_scaling: True
  test:
    inverse_transform_name: scaler_target
    metric_names: ["mape", "phm_score", "mae", "mse", "rmse"]
    apply_inverse_scaling: True


callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

dataset:
  dataset_cfg:
    get_unit_id: true # Adds unit ids to the dataset output hennce to the batch as well. Note that to it works solely if data unit metadata has unit_name and unit_id.

