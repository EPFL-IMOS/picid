#@package _global_

defaults:
  - override /datasource: pronostia
  - override /evaluator: default
  - override /task_definition: prognostics/rul

evaluator:
  train:
    inverse_transform_name: scaler_target
    apply_inverse_scaling: True
  val:
    inverse_transform_name: scaler_target
    apply_inverse_scaling: True
  test:
    inverse_transform_name: scaler_target
    apply_inverse_scaling: True


callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min



# task_definition:
#   seq_len: 1024
#   stride: 1024
  
  
datamodule: 
  train_batch_size: 16
  val_batch_size: 16
  test_batch_size: 16
  shuffle_train: True



dataset:
  dataset_cfg:
    get_unit_id: true # Adds unit ids to the dataset output hennce to the batch as well. Note that to it works solely if data unit metadata has unit_name and unit_id.