#@package _global_

defaults:
  - override /datasource: xjtu_sy
  - override /evaluator: default
  - override /task_definition: prognostics/rul


callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

evaluator:
  train:
    inverse_transform_name: scaler_target
    apply_inverse_scaling: True

  val:
    inverse_transform_name: scaler_target
    apply_inverse_scaling: True

  test:
    inverse_transform_name: scaler_target
    apply_inverse_scaling: True

