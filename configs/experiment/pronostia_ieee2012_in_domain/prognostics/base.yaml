#@package _global_

defaults:
  - override /datasource: pronostia_ieee2012_in_domain
  - override /evaluator: per_unit
  - override /task_definition: prognostics/rul

evaluator:
  train:
    inverse_transform_name: scaler_target
    metric_names: ["phm_score", "mae", "mse", "rmse"]
    apply_inverse_scaling: True
  val:
    inverse_transform_name: scaler_target
    metric_names: ["phm_score", "mae", "mse", "rmse"]
    apply_inverse_scaling: True
  test:
    inverse_transform_name: scaler_target
    metric_names: ["phm_score", "mae", "mse", "rmse"]
    apply_inverse_scaling: True

dataset:
  dataset_cfg:
    get_unit_id: true
