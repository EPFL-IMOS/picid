#@package _global_

defaults:
  - unibo/prognostics/base
  - /model_configs/prognostics/stf
  
  - override /dataset: prognostics/battery_rul_multiunit_dataset
  - override /transforms: battery/unibo_compression_by_autoencoder

callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

# Need to correct it
model:
  d_x: 6
  d_x_embedding_router:  [0,0,0,0,0,0]
  base_lr: 0.001

