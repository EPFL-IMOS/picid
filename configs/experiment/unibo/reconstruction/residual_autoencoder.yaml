#@package _global_

defaults:
  - unibo/reconstruction/base
  - /model_configs/reconstruction/residual_autoencoder
  - override /transforms: battery/autoencoder

task_definition:
  seq_len: 128

datamodule:
  train_batch_size: 256
  val_batch_size: 256
  test_batch_size: 256

# it has to go to model_configs when I know how to infere input_channels with ${infere_dim: features, -1}
model: 
  input_channels: 3
  latent_dim: 32
  dropout_prob: 0.2

  blocks_config:
    - in: 3
      out: 16
      kernel: 5
      stride: 2

    - in: 16
      out: 8
      kernel: 3
      stride: 2