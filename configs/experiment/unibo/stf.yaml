#@package _global_

defaults:
  - unibo/base
  - override /transforms: battery/bosello_unibo
  - override /model: stf
  - override /dataset: prognostics/battery_rul_multiunit_dataset
  - override /datamodule: base_datamodule

callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

model:
  d_x: 6
  d_x_embedding_router:  [0,0,0,0,0,0]
  base_lr: 0.001

