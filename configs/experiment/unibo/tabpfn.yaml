#@package _global_

defaults:
  - override /datasource: unibo21_battery
  - override /transforms: battery/bosello_unibo
  - override /model: tabpfn_batch_context
  - override /dataset: prognostics/battery_rul_multiunit_dataset
  - override /datamodule: base_datamodule_tabpfn
