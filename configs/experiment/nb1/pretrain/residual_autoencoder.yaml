#@package _global_

defaults:
  - override /datasource: nb1
  - override /transforms: battery/autoencoder
  - override /model: residual_autoencoder
  - override /dataset: prognostics/rul_multiunit_dataset
  - override /evaluator: default
  - override /task_definition: reconstruction/autoencoder
  #- override /trainer: cpu 


callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    save_weights_only: False
    monitor: val/loss
    mode: min

