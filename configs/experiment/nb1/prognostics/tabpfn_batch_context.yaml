#@package _global_

defaults:
  - nb1/base
  - /model_configs/prognostics/tabpfn_batchwise
  - override /transforms: battery/bosello_NB_base
  - override /dataset: prognostics/battery_rul_multiunit_dataset

evaluator:
  train:
    apply_inverse_scaling: True

  val:
    apply_inverse_scaling: True

  test:
    apply_inverse_scaling: True

transforms:
  filter_features:
    transform:
      columns_to_keep:
        [
          "voltage_mean",
          "voltage_var",
          "current_mean",
          "current_var",
          "temperature_mean",
          "temperature_var",
        ]
