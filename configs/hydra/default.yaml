# https://hydra.cc/docs/configure_hydra/intro/
# WARNING, this is a special config. To acess it from your code, use:
# from hydra.core.hydra_config import HydraConfig
# hydra_cfg = HydraConfig.get()
# to access it from yaml use ${hydra:...}

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
run:
  dir: ${paths.artifacts_dir}/${experiment_group}/runs/${hydra.job.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  dir: ${paths.artifacts_dir}/${experiment_group}/multiruns/${hydra.job.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      filename: ${hydra.runtime.output_dir}/${experiment_group}.log

job:
  # get the selected option from the experiment group, then flatten it
  name: ${flat:${experiment_group}/${hydra:runtime.choices.experiment}}
