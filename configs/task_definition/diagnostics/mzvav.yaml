# https://www.nature.com/articles/s41597-020-0398-6

seq_len: 50 # window size
label_len: 0 # overlap size
pred_len: 0 # prediction size
task_type: fault_classification
padding_left_flag: True # Ensure sequences are left-padded to have enough history and consistent lengths of train/val/test regardless of seq_len
stride: 1
stride_train: 1
num_classes: 4

model:
  data_requirements:
    input_tensors:
      - features
      - ${task_definition.task_type}

target_metric: val/f1
target_metric_mode: max
