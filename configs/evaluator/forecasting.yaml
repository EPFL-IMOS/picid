_evaluator_defaults: &evaluator_defaults
  _target_: picid.evaluator.forecasting.ForecastingEvaluator
  metric_names: ["mae", "mse"]

  apply_inverse_scaling: True
  # Option A (by name): explicit transform, e.g. scaler_target
  # inverse_transform_name: scaler_target
  # Option B (by key): use data key (assign_to); e.g. rul when target scaler has assign_to: rul
  # inverse_transform_key: rul  # then inverse_transform_name not needed
  save_predictions: True

  model_seq_len: ${task_definition.seq_len}
  model_label_len: ${task_definition.label_len}
  model_pred_len: ${task_definition.pred_len}

  # Some models predict always a multivariate time-series but then at evaluation we have to evaluate on one particular variable, hence here is a proposition how to tackle such cases
  task_mode: ${datasource.task_mode} # univariate/multivariate
  target_dim_position: null #${datasource.target_var_dim}

  effective_pred_len: null #24
  paths: ${paths}
  hooks:
    - _target_: picid.evaluator.hooks.save_predictions.SavePredictionsHook
      dims: ["sample", "time", "feature"]

train: *evaluator_defaults
val: *evaluator_defaults
test: *evaluator_defaults
