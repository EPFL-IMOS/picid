#@package _global_

defaults:
  - unibo/reconstruction/base
  - /model_configs/reconstruction/residual_autoencoder
  - override /transforms: shared/reconstruction/residual_autoencoder

task_definition:
  seq_len: 128

datamodule:
  train_batch_size: 1024
  val_batch_size: 1024
  test_batch_size: 1024

# it has to go to model_configs when I know how to infere input_channels with ${infere_dim: features, -1}
model:
  input_channels: 3 # ${infer_data_dim:features,-1}
  latent_dim: 128
  dropout_prob: 0.2

  output_channels: [16, 32, 64]
  kernels: [5, 5, 5]
  strides: [2, 2, 2]
  dilations: [1, 1, 1]
