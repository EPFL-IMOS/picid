#@package _global_

defaults:
  - nb14/base
  - nb14/reconstruction/base
  - /model_configs/reconstruction/residual_autoencoder
  - override /transforms: shared/reconstruction/residual_autoencoder

task_definition:
  seq_len: 128
  stride: 10

datamodule:
  train_batch_size: 1024
  val_batch_size: 1024
  test_batch_size: 1024

model:
  latent_dim: 32
  dropout_prob: 0.2

  output_channels: [16, 32, 64]
  kernels: [5, 5, 5]
  strides: [2, 2, 2]
  dilations: [1, 1, 1]
