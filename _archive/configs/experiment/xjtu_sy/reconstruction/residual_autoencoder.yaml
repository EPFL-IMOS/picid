#@package _global_

defaults:
  - xjtu_sy/base
  - xjtu_sy/reconstruction/base
  - /model_configs/reconstruction/residual_autoencoder
  - override /transforms: shared/reconstruction/residual_autoencoder

task_definition:
  seq_len: 128

datamodule:
  train_batch_size: 1024
  val_batch_size: 1024
  test_batch_size: 1024

# it has to go to model_configs when I know how to infere input_channels with ${infere_dim: features, -1}
model:
  input_channels: 2
  latent_dim: 32
  dropout_prob: 0.2

  blocks_config:
    - in: 2
      out: 16
      kernel: 7
      stride: 2

    - in: 16
      out: 32
      kernel: 5
      stride: 2

    - in: 32
      out: 64
      kernel: 3
      stride: 2
