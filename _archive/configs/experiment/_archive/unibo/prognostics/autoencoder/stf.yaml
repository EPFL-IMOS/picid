#@package _global_

defaults:
  - unibo/prognostics/base
  - /model_configs/prognostics/stf

  - override /dataset: prognostics/rul_multiunit_dataset
  - override /transforms: battery/unibo/residual_autoencoder
callbacks:
  early_stopping:
    monitor: val/loss
    mode: min

  model_checkpoint:
    monitor: val/loss
    mode: min

