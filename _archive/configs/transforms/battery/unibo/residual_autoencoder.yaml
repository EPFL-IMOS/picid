defaults:
  - battery/shared/reconstruction/residual_autoencoder@_here_

scaler_target:
  transform:
    _target_: picid.transforms.base_transforms.scaler.MinMaxScalerSklearn

  metadata:
    apply_to: target
    fit_on: train

autoencoder:
  transform:
    _target_:  picid.transforms.battery.autoencoder_transform.BatteryAutoencoderTransform  # Your wrapper class
    folder_name: ${paths.root_dir}/artifacts/debug/runs/unibo+reconstruction+residual_autoencoder/2025-10-01_23-23-34

  metadata:
    apply_to: ['features', 'target']
    assign_to:
      features: features
      target: rul


sequence2combined:
  transform:
    _target_: picid.transforms.battery.sequence2combined.Sequence2combined
    padding_value: null

  metadata:
    apply_to: 'features'


ragged2regularragged:
  transform:
    _target_: picid.transforms.base_transforms.shape_manipulations.RegularizeRaggedDataTransform

  metadata:
    apply_to: 'features'
