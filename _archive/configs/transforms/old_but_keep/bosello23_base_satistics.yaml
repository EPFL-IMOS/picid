# This transform is used for NB1 and NB14. The only required change is the `columns_to_keep` parameter.
# This file reads from datasource to find the task_mode i.e., rul or ahRul (${datasource.task_mode})
get_simple_feature_statistics:
  transform:
    _target_:  picid.transforms.battery.nb1_transforms.Cycles2Statistics  # Your wrapper class
    target_name: ${datasource.task_mode}  # Use the task_mode from the dataset config
    cycles_identifier: rul
    battery_mode_state: mode
  
  metadata:
    apply_to: ['features', 'metadata']
    assign_to: features
    
# Transfrom which takes a column from the features and assigns it to target
assign_updated_taget_from_features:
  transform:
    _target_:  picid.transforms.battery.nb1_transforms.UpdateTarget  # Your wrapper class
    target_name: ${datasource.task_mode}
    apply_to_key: features
    
  metadata:
    apply_to: ['features', 'metadata']
    assign_to: target
    
    
filter_features:
  transform:
    _target_:  picid.transforms.battery.nb1_transforms.FilterDataFrameColumns  
    columns_to_keep: null #['voltage_mean', 'voltage_var', 'current_mean','current_var', 'temperature_mean', 'temperature_var'] # 'mode',
    apply_to_key: features

  metadata:
    apply_to: ${transforms.filter_features.transform.apply_to_key}


scaler_features:
  transform:
    _target_:  picid.transforms.base_transforms.scaler.MinMaxScalerSklearn  
    
  metadata:
    apply_to: features
    fit_on: train


AssignNaiveTimefeatures:
  transform:
    _target_:  picid.transforms.battery.nb1_transforms.AssignNaiveTimefeatures  
    
  metadata:
    apply_to: features
    assign_to: time_features

scaler_target:
  transform:
    _target_: picid.transforms.base_transforms.scaler.MinMaxScalerSklearn
  
  metadata:
    apply_to: target
    fit_on: train