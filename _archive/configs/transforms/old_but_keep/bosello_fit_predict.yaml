defaults:
  - battery/bosello_NB_base@_here_


concatenate_X:
  # Concatenate time-features to the feature set
  transform:
    _target_: picid.transforms.base_transforms.concatenate.ConcatenateTransform
  metadata:
    apply_to: ['features', 'time_features']
    assign_to: X

concatenate_y:
  # Concatenate time-features to the feature set
  transform:
    _target_: picid.transforms.base_transforms.concatenate.ConcatenateTransform
  metadata:
    apply_to: ['target']
    assign_to: y

# Introduce the task dimension to X, y. We
reshape_X:
  transform:
    _target_: picid.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b -> 1 a b"
  metadata:
    apply_to: ['X']
    assign_to: X

reshape_y:
  transform:
    _target_: picid.transforms.base_transforms.reshaping.ReshapeTransform
    pattern: "a b -> 1 a b"
  metadata:
    apply_to: ['y']
    assign_to: y
