[project]
name = "TabPHM"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy<=2.3.0",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "einops>=0.7.0",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.1",
    "omegaconf>=2.3.0",
    "torchsummary>=1.5.1",
    "pyrootutils>=1.0.4",
    "lightning>=2.5.2",
    "performer-pytorch>=1.1.4",
    "torchinfo>=1.7.1",
    "h5netcdf>=1.1.0",
    "netcdf4>=1.6.5",
    "openpyxl>=3.1.2",
    "tabpfn>=2.0.6",
    "jupyter>=1.1.1",
    "python-box>=7.3.2",
    "positional-encodings>=6.0.3",
    # Careful with wandb 0.23.0, we were loosing results on wandb due to an unknown bug
    "wandb>=0.22.0",
    "progpy>=1.7.1",
    "pyarrow>=20.0.0",
    "autogluon>=1.3.1",
    "rich>=14.0.0",
    "awkward>=2.8.7",
    "xarray>=2025.10.1",
    "hvplot>=0.12.1",
    "h5py>=3.14.0",
    "faiss-cpu>=1.12.0",
    "huggingface-hub>=0.35.3",
    # Local submodule dependencies
    # uv will resolve these using [tool.uv.sources]
    "tabdpt",
    "carte-ai",
    "phmd",
    "TabPFN",
    "rul-datasets",
    "sortedcontainers>=2.4.0",
    "numba>=0.62.1",
    "cloudpickle>=3.1.1",
    "fvcore>=0.1.5.post20221221",
]

[project.optional-dependencies]
dev = [
    "nox>=2025.11.12",
    "pytest",
    "pytest-cov",
    "coverage",
    "jupyter",
    "mypy",
    "pytest-mock",
    "mkdocs-material>=9.6.20",
    "mkdocstrings[python]>=0.30.0",
    # "uni2ts",
    "viztracer>=1.0.4",
    "panel>=1.8.1",
    "holoviews>=1.21.0",
]

[tool.setuptools]
# If your package is at the top-level (./lmetk), this is fine:
packages = ["lmetk"]

# If your package lives under src/, replace with:
# [tool.setuptools.packages.find]
# where = ["src"]

[tool.pylint."messages control"]
disable = ["logging-fstring-interpolation"]

[tool.coverage.run]
# Only measure coverage for your own code
source = ["lmetk"]
omit = [
    "local_packages/*",
    "*/local_packages/*",
]

[tool.coverage.report]
# Exclude local_packages from reports
omit = [
    "local_packages/*",
    "*/local_packages/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


[tool.uv.sources]
phmd = { path = "./local_packages/phmd", editable = true }
TabPFN = { path = "./local_packages/TabPFN", editable = true }
tabdpt = { path = "./local_packages/TabDPT", editable = true }
carte-ai = { path = "./local_packages/carte-ai", editable = true }
rul-datasets = { path = "./local_packages/rul-datasets", editable = true }
# uni2ts = { path = "./local_packages/uni2ts", editable = true }

torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
chronosx = { git = "https://github.com/amazon-science/chronos-forecasting.git", rev = "chronosx" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
