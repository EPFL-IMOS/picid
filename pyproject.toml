[project]
name = "TabPHM"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "einops>=0.7.0",
    # "numba==0.58.1",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.1",
    "omegaconf>=2.3.0",
    "torchsummary>=1.5.1",
    "pyrootutils>=1.0.4",
    "lightning>=2.5.2", # "lightning==2.0.0",
    "hydra-colorlog", # already specified with version above — can remove this line unless intended
    "performer-pytorch>=1.1.4",
    "torchinfo>=1.7.1",
    "h5netcdf>=1.1.0",
    "netCDF4>=1.6.5",
    "openpyxl>=3.1.2",
    "tabpfn>=2.0.6",
    "jupyter>=1.1.1",
    "python-box>=7.3.2",
    "pytest>=8.3.5",
    "positional-encodings>=6.0.3",
    "wandb>=0.20.1",
    "progpy>=1.7.1",
    "pyarrow>=20.0.0",
    "autogluon>=1.3.1",
    "rich>=14.0.0",
    "awkward>=2.8.7",
]
#"phmd @ git+https://github.com/EPFL-IMOS/imos_phmd.git@collab_lalr",

[tool.setuptools]
packages = ["lmetk"]

[project.optional-dependencies]

test = ["pytest", "pytest-cov", "coverage", "jupyter", "mypy", "pytest-mock"]

