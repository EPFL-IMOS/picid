[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["picid"]

[project]
name = "TabPHM"
version = "0.1.0"
description = "Prognostics, Health Management (PHM) and Forecasting Benchmark Arena — a unified, config-driven framework for PHM and forecasting experiments from data loading to evaluation."
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # License: to be decided
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "numpy<=2.3.0",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "einops>=0.7.0",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.1",
    "omegaconf>=2.3.0",
    "torchsummary>=1.5.1",
    "pyrootutils>=1.0.4",
    "lightning>=2.5.2",
    "performer-pytorch>=1.1.4",
    "torchinfo>=1.7.1",
    "h5netcdf>=1.1.0",
    "netcdf4>=1.6.5",
    "openpyxl>=3.1.2",
    "tabpfn>=2.0.6",
    "jupyter>=1.1.1",
    "python-box>=7.3.2",
    "positional-encodings>=6.0.3",
    # Careful with wandb >=0.23.0, we were loosing results on wandb due to an unknown bug
    "wandb==0.22.0",
    "progpy>=1.7.1",
    "pyarrow>=20.0.0",
    "autogluon>=1.3.1",
    "rich>=14.0.0",
    "awkward>=2.8.7",
    "xarray>=2025.10.1",
    "hvplot>=0.12.1",
    "h5py>=3.14.0",
    "faiss-cpu==1.11.0",
    "huggingface-hub>=0.35.3",
    # Local submodule dependencies
    # uv will resolve these using [tool.uv.sources]
    "tabdpt",
    "carte-ai",
    "phmd",
    "TabPFN",
    "rul-datasets",
    "sortedcontainers>=2.4.0",
    "numba>=0.62.1",
    "cloudpickle>=3.1.1",
    "fvcore>=0.1.5.post20221221",
    "tables>=3.10.2",
    "questionary>=2.0.0",
]

[project.scripts]
picid-assemble = "picid.cli.assemble:main"
picid-generate-web = "picid.cli.generate_web:main"

[project.optional-dependencies]
dev = [
    "nox>=2025.11.12",
    "pytest",
    "pytest-cov",
    "coverage",
    "jupyter",
    "mypy",
    "pytest-mock",
    "mkdocs-material>=9.6.20",
    "mkdocstrings[python]>=0.30.0",
    # "uni2ts",
    "viztracer>=1.0.4",
    "panel>=1.8.1",
    "holoviews>=1.21.0",
]

[tool.setuptools]
# If your package is at the top-level (./picid), this is fine:
packages = ["picid"]

# If your package lives under src/, replace with:
# [tool.setuptools.packages.find]
# where = ["src"]

[tool.pytest.ini_options]
# All test temp dirs (plot_dir, eval_details, etc.) go under test/ and are cleaned after runs
addopts = "--basetemp=test/.pytest_tmp"
# Add --cov=picid --cov-fail-under=95 when running coverage (e.g. pytest test/ --cov=picid --cov-fail-under=95)
markers = [
    "requires_snapshots: skip when pipeline snapshot fixtures are missing; regenerate with: uv run python scripts/snapshot/generate_pipeline_snapshots.py",
    "slow: slow benchmarks (e.g. __getitem__ timing); skip with -m 'not slow'",
]

[tool.pylint."messages control"]
disable = ["logging-fstring-interpolation"]

[tool.coverage.run]
# Only measure coverage for your own code
source = ["picid"]
omit = [
    "local_packages/*",
    "*/local_packages/*",
    "picid/data/datasources/picasso/time_series_datamodule.py",
    "picid/data/datasources/picasso/picasso_datasource.py",
    "picid/data/datasources/unibo/loader.py",
    "picid/__init__.py",
    # CLI/entry and demo modules
    "picid/run.py",
    "picid/simplified_run.py",
    "picid/simplified_run_objects.py",
    "picid/verify_environment.py",
    "picid/data/datasources/toy_example.py",
    "picid/data/datasources/airbus_helicopter.py",
    "picid/transforms/visualization/features_target_plotter.py",
    "picid/data/datasources/concepts_n_cmapss.py",
    # PHMD datasources; low-coverage integration paths
    "picid/data/datasources/phmd_phme20.py",
    "picid/data/datasources/phmd_pubd16.py",
    "picid/data/datasources/phmd_n_cmapss.py",
    "picid/data/datasources/phmd_xjtu_sy.py",
    "picid/data/datasources/phmd_battery.py",
    "picid/data/datasources/phmd_cbmv3.py",
    "picid/data/datasources/phmd_pronostia.py",
    "picid/data/datasources/phmd_hsf15.py",
    "picid/data/datasources/agtf30k.py",
    "picid/data/datasources/nb14/loader.py",
]

[tool.coverage.report]
# Exclude local_packages from reports
omit = [
    "local_packages/*",
    "*/local_packages/*",
    "picid/data/datasources/picasso/time_series_datamodule.py",
    "picid/data/datasources/picasso/picasso_datasource.py",
    "picid/data/datasources/unibo/loader.py",
    "picid/__init__.py",
    # CLI/entry and demo modules
    "picid/run.py",
    "picid/simplified_run.py",
    "picid/simplified_run_objects.py",
    "picid/verify_environment.py",
    "picid/data/datasources/toy_example.py",
    "picid/data/datasources/airbus_helicopter.py",
    "picid/transforms/visualization/features_target_plotter.py",
    "picid/data/datasources/concepts_n_cmapss.py",
    # PHMD datasources; low-coverage integration paths
    "picid/data/datasources/phmd_phme20.py",
    "picid/data/datasources/phmd_pubd16.py",
    "picid/data/datasources/phmd_n_cmapss.py",
    "picid/data/datasources/phmd_xjtu_sy.py",
    "picid/data/datasources/phmd_battery.py",
    "picid/data/datasources/phmd_cbmv3.py",
    "picid/data/datasources/phmd_pronostia.py",
    "picid/data/datasources/phmd_hsf15.py",
    "picid/data/datasources/agtf30k.py",
    "picid/data/datasources/nb14/loader.py",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


[tool.uv.sources]
phmd = { path = "./local_packages/phmd", editable = true }
TabPFN = { path = "./local_packages/TabPFN", editable = true }
tabdpt = { path = "./local_packages/TabDPT", editable = true }
carte-ai = { path = "./local_packages/carte-ai", editable = true }
# obsolete: rul-datasets = { path = "./local_packages/rul-datasets", editable = true }
# obsolete: uni2ts = { path = "./local_packages/uni2ts", editable = true }

torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
chronosx = { git = "https://github.com/amazon-science/chronos-forecasting.git", rev = "chronosx" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
