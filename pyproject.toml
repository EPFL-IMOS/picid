[project]
name = "TabPHM"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "einops>=0.7.0",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.1",
    "omegaconf>=2.3.0",
    "torchsummary>=1.5.1",
    "pyrootutils>=1.0.4",
    "lightning>=2.5.2",
    "performer-pytorch>=1.1.4",
    "torchinfo>=1.7.1",
    "h5netcdf>=1.1.0",
    "netCDF4>=1.6.5",
    "openpyxl>=3.1.2",
    "tabpfn>=2.0.6",
    "jupyter>=1.1.1",
    "python-box>=7.3.2",
    "positional-encodings>=6.0.3",
    "wandb>=0.20.1",
    "progpy>=1.7.1",
    "pyarrow>=20.0.0",
    "autogluon>=1.3.1",
    "rich>=14.0.0",
    "awkward>=2.8.7",
    "xarray>=2025.9.0",
    "hvplot>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "jupyter",
    "mypy",
    "pytest-mock",
    "mkdocs-material>=9.6.20",
    "mkdocstrings[python]>=0.30.0",
    "phmd",
    "TabPFN",
    "viztracer>=1.0.4",
    "panel>=1.8.1",
    "holoviews>=1.21.0",
]

[tool.setuptools]
# If your package is at the top-level (./lmetk), this is fine:
packages = ["lmetk"]

# If your package lives under src/, replace with:
# [tool.setuptools.packages.find]
# where = ["src"]

[tool.pylint."messages control"]
disable = ["logging-fstring-interpolation"]


[tool.uv.sources]
phmd = { path = "./phmd", editable = true }
TabPFN = { path = "./TabPFN", editable = true }

torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
