seq_len: 10  # Match diagnostics; patchtst requires seq_len >= patch_len
label_len: 0
pred_len: 0  # FaultClassificationBatchDataset (extends RUL) requires pred_len=0
task_type: anomaly_detection
padding_left_flag: true
stride: 1
stride_train: 1
num_classes: 2

model:
  data_requirements:
    input_tensors:
      - features
      - ${task_definition.task_type}

target_metric: val/f1
target_metric_mode: max
