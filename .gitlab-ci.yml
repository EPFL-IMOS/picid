image: python:3.12

# Define stages
stages:
  - test

# Define global cache for uv and pip to speed up runs
cache:
  paths:
    - .venv/
    - .uv_cache/

# Variables to configure uv cache location
variables:
  UV_CACHE_DIR: ".uv_cache"

# Rules: Run on Merge Requests AND pushes to main
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

test_pipeline:
  stage: test
  before_script:
    # 1. Install uv (The recommended way for CI environments)
    - pip install uv

    # 2. Clone all submodules (Critical step from your docs)
    # GIT_STRATEGY: fetch is default, but we need to ensure submodules are pulled
    - git submodule update --init --recursive

    # 3. Create Virtual Environment
    - uv venv

    # 4. Activate the environment
    # In GitLab CI, we source it in every step or add it to PATH
    - source .venv/bin/activate

    # 5. Install dependencies using uv sync (installs from lockfile)
    - uv sync

    # 6. Install the project in editable mode with dev dependencies
    # This also handles local submodule installation if defined in pyproject.toml
    - uv pip install -e ".[dev]"

  script:
    # 7. Activate env again (each script block runs in a fresh shell usually)
    - source .venv/bin/activate

    # 8. Run Pytest with Coverage
    - pytest --cov --cov-report=xml:coverage.xml --cov-report=term test/

  # 9. Configure Coverage Reporting for GitLab UI
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
